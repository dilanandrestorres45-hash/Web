name: Compilar APK Android

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Crear APK Web
        uses: w3c/pwa-build-action@v1
        with:
          pwa-url: 'https://example.com'
          output-dir: 'output'

      - name: Compilar APK con Capacitor CLI
        run: |
          mkdir -p www
          shopt -s extglob
          cp -r !(www|.git|.github) www/ || true
          npm install -g @capacitor/cli @capacitor/core
          npm install @capacitor/android@5.7.0 @capacitor/core@5.7.0
          npx cap init "MiApp" "com.miapp.app" --web-dir www
          npx cap add android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --warning-mode none

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: mi-app-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
